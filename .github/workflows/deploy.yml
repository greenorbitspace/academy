name: Deploy LMS to GitHub Pages

on:
  push:
    branches:
      - develop  # Trigger deployment when you push to develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Deploy static files to gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./  # Root of the repo, where index.html and assets/ live
          publish_branch: gh-pages